<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking App - Security Monitoring Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #0a0015 0%, #1a0a2e 50%, #16012c 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e0d4ff;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(138, 43, 226, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(75, 0, 130, 0.15) 0%, transparent 50%);
            pointer-events: none;
            animation: pulse 8s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.1) 0%, rgba(75, 0, 130, 0.1) 100%);
            padding: 40px 30px;
            border-radius: 20px;
            border: 2px solid rgba(138, 43, 226, 0.3);
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
            text-align: center;
            animation: slideDown 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(138, 43, 226, 0.1), transparent);
            animation: scan 3s linear infinite;
        }
        
        @keyframes scan {
            0% { transform: translateX(-100%) translateY(-100%); }
            100% { transform: translateX(100%) translateY(100%); }
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5em;
            font-weight: 900;
            background: linear-gradient(135deg, #b19cd9 0%, #8a2be2 50%, #4b0082 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: 2px;
            position: relative;
            animation: glow 2s ease-in-out infinite;
        }
        
        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 20px rgba(138, 43, 226, 0.5),
                             0 0 40px rgba(138, 43, 226, 0.3);
            }
            50% {
                text-shadow: 0 0 30px rgba(138, 43, 226, 0.8),
                             0 0 60px rgba(138, 43, 226, 0.5);
            }
        }

        .header p {
            color: #b19cd9;
            font-size: 1.2em;
            font-weight: 500;
            letter-spacing: 1px;
            position: relative;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out 0.2s backwards;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.15) 0%, rgba(75, 0, 130, 0.15) 100%);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(138, 43, 226, 0.3);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(138, 43, 226, 0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .stat-card:hover::before {
            left: 100%;
        }

        .stat-card:hover {
            transform: translateY(-8px);
            border-color: #8a2be2;
            box-shadow: 0 10px 30px rgba(138, 43, 226, 0.3);
        }

        .stat-card h3 {
            color: #9d8fb8;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .stat-card .value {
            font-family: 'Orbitron', sans-serif;
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 10px;
            position: relative;
        }

        .stat-card.total .value { 
            color: #b19cd9;
            text-shadow: 0 0 20px rgba(177, 156, 217, 0.5);
        }
        .stat-card.normal .value { 
            color: #69f0ae;
            text-shadow: 0 0 20px rgba(105, 240, 174, 0.5);
        }
        .stat-card.suspicious .value { 
            color: #ff6b9d;
            text-shadow: 0 0 20px rgba(255, 107, 157, 0.5);
        }
        .stat-card.time .value { 
            color: #ffd93d;
            font-size: 2.5em;
            text-shadow: 0 0 20px rgba(255, 217, 61, 0.5);
        }

        .logs-section {
            background: linear-gradient(135deg, rgba(26, 10, 46, 0.8) 0%, rgba(16, 1, 44, 0.8) 100%);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid rgba(138, 43, 226, 0.3);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.8s ease-out 0.4s backwards;
        }

        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(138, 43, 226, 0.3);
        }

        .logs-header h2 {
            font-family: 'Orbitron', sans-serif;
            color: #b19cd9;
            font-size: 1.8em;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #8a2be2 0%, #4b0082 100%);
            color: white;
            border: 2px solid rgba(138, 43, 226, 0.5);
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1em;
            font-weight: 600;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .refresh-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
        }
        
        .refresh-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .refresh-btn:hover {
            background: linear-gradient(135deg, #9d4edd 0%, #5a189a 100%);
            border-color: #b19cd9;
            box-shadow: 0 5px 20px rgba(138, 43, 226, 0.4);
            transform: translateY(-2px);
        }
        
        .refresh-btn:active {
            transform: translateY(0);
        }

        .logs-table {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.2) 0%, rgba(75, 0, 130, 0.2) 100%);
        }

        th {
            padding: 18px 15px;
            text-align: left;
            font-weight: 700;
            color: #b19cd9;
            border-bottom: 2px solid rgba(138, 43, 226, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9em;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid rgba(138, 43, 226, 0.2);
            color: #c8b8e8;
        }

        tbody tr {
            transition: all 0.3s ease;
            position: relative;
        }
        
        tbody tr::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, rgba(138, 43, 226, 0.1), transparent);
            transition: width 0.3s ease;
        }

        tbody tr:hover::before {
            width: 100%;
        }

        tbody tr:hover {
            background: rgba(138, 43, 226, 0.05);
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .badge.normal {
            background: linear-gradient(135deg, rgba(105, 240, 174, 0.2), rgba(105, 240, 174, 0.1));
            color: #69f0ae;
            border: 1px solid rgba(105, 240, 174, 0.3);
        }

        .badge.suspicious {
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.2), rgba(255, 107, 157, 0.1));
            color: #ff6b9d;
            border: 1px solid rgba(255, 107, 157, 0.3);
            animation: alertPulse 2s infinite;
        }
        
        @keyframes alertPulse {
            0%, 100% {
                box-shadow: 0 0 10px rgba(255, 107, 157, 0.3);
            }
            50% {
                box-shadow: 0 0 20px rgba(255, 107, 157, 0.6);
            }
        }

        .method {
            font-family: 'Orbitron', monospace;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .method.GET { 
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.2), rgba(138, 43, 226, 0.1));
            color: #b19cd9;
            border: 1px solid rgba(138, 43, 226, 0.3);
        }
        .method.POST { 
            background: linear-gradient(135deg, rgba(255, 217, 61, 0.2), rgba(255, 217, 61, 0.1));
            color: #ffd93d;
            border: 1px solid rgba(255, 217, 61, 0.3);
        }
        .method.PUT { 
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.3), rgba(75, 0, 130, 0.2));
            color: #c8b8e8;
            border: 1px solid rgba(138, 43, 226, 0.4);
        }
        .method.DELETE { 
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.2), rgba(255, 107, 157, 0.1));
            color: #ff6b9d;
            border: 1px solid rgba(255, 107, 157, 0.3);
        }
        
        .method:hover {
            transform: scale(1.1);
            box-shadow: 0 3px 10px rgba(138, 43, 226, 0.3);
        }

        .status {
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
        }

        .status-200 { 
            color: #69f0ae;
            text-shadow: 0 0 10px rgba(105, 240, 174, 0.5);
        }
        .status-400 { 
            color: #ffd93d;
            text-shadow: 0 0 10px rgba(255, 217, 61, 0.5);
        }
        .status-500 { 
            color: #ff6b9d;
            text-shadow: 0 0 10px rgba(255, 107, 157, 0.5);
        }

        .path {
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            color: #9d8fb8;
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .loading {
            text-align: center;
            padding: 60px 40px;
            color: #b19cd9;
            font-size: 1.3em;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .no-data {
            text-align: center;
            padding: 80px 40px;
            color: #9d8fb8;
        }

        .no-data h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8em;
            margin-bottom: 15px;
            color: #b19cd9;
            letter-spacing: 2px;
        }
        
        .no-data p {
            font-size: 1.1em;
            color: #9d8fb8;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .live-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #69f0ae;
            border-radius: 50%;
            margin-right: 10px;
            animation: blink 2s infinite;
            box-shadow: 0 0 15px rgba(105, 240, 174, 0.8);
            position: relative;
        }
        
        .live-indicator::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: rgba(105, 240, 174, 0.3);
            border-radius: 50%;
            animation: ripple 2s infinite;
        }
        
        @keyframes ripple {
            0% {
                width: 12px;
                height: 12px;
                opacity: 1;
            }
            100% {
                width: 30px;
                height: 30px;
                opacity: 0;
            }
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .logs-header {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }
            
            .logs-table {
                font-size: 0.85em;
            }
            
            th, td {
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ Banking Application Security Monitor</h1>
            <p><span class="live-indicator"></span>Real-time Request Monitoring & Threat Detection</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card total">
                <h3>Total Requests</h3>
                <div class="value" id="totalRequests">0</div>
            </div>
            <div class="stat-card normal">
                <h3>Normal Traffic</h3>
                <div class="value" id="normalRequests">0</div>
            </div>
            <div class="stat-card suspicious">
                <h3>Suspicious Requests</h3>
                <div class="value" id="suspiciousRequests">0</div>
            </div>
            <div class="stat-card time">
                <h3>Avg Response Time</h3>
                <div class="value" id="avgTime">0ms</div>
            </div>
        </div>

        <div class="logs-section">
            <div class="logs-header">
                <h2>📋 Request Log</h2>
                <button class="refresh-btn" onclick="fetchData()">🔄 Refresh</button>
            </div>
            
            <div id="logsContainer">
                <div class="loading">Loading data...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/BankingSystemWeb';
        let autoRefresh = true;

        async function fetchData() {
            try {
                // Fetch stats
                const statsResponse = await fetch(`${API_BASE}/api/stats`);
                const stats = await statsResponse.json();
                
                document.getElementById('totalRequests').textContent = stats.totalRequests || 0;
                document.getElementById('normalRequests').textContent = stats.normalRequests || 0;
                document.getElementById('suspiciousRequests').textContent = stats.suspiciousRequests || 0;
                document.getElementById('avgTime').textContent = 
                    stats.avgProcessingTime ? Math.round(stats.avgProcessingTime) + 'ms' : '0ms';

                // Fetch logs
                const logsResponse = await fetch(`${API_BASE}/api/logs`);
                const logs = await logsResponse.json();
                
                displayLogs(logs);
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('logsContainer').innerHTML = 
                    '<div class="no-data"><h3>⚠️ Cannot connect to Banking Application</h3><p>Make sure the app is running on http://localhost:8080</p></div>';
            }
        }

        function displayLogs(logs) {
            const container = document.getElementById('logsContainer');
            
            if (!logs || logs.length === 0) {
                container.innerHTML = '<div class="no-data"><h3>No requests yet</h3><p>Start using the banking application to see requests here</p></div>';
                return;
            }

            // Reverse to show newest first
            const reversedLogs = [...logs].reverse().slice(0, 50);

            const tableHTML = `
                <div class="logs-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Method</th>
                                <th>Path</th>
                                <th>Status</th>
                                <th>Time (ms)</th>
                                <th>Client IP</th>
                                <th>Security</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${reversedLogs.map(log => `
                                <tr>
                                    <td>${formatTime(log.timestamp)}</td>
                                    <td><span class="method ${log.method}">${log.method}</span></td>
                                    <td><div class="path" title="${log.path}">${log.path}</div></td>
                                    <td><span class="status status-${Math.floor(log.statusCode/100)}00">${log.statusCode}</span></td>
                                    <td>${log.processingTime}</td>
                                    <td>${log.clientIp}</td>
                                    <td>
                                        <span class="badge ${log.isSuspicious ? 'suspicious' : 'normal'}">
                                            ${log.isSuspicious ? '🚨 Suspicious' : '✓ Normal'}
                                        </span>
                                    </td>
                                    <td>${log.suspiciousReason}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = tableHTML;
        }

        function formatTime(timestamp) {
            if (!timestamp) return '-';
            try {
                const date = new Date(timestamp);
                return date.toLocaleTimeString();
            } catch (e) {
                return timestamp.substring(11, 19);
            }
        }

        // Initial load
        fetchData();

        // Auto-refresh every 12 seconds
        setInterval(() => {
            if (autoRefresh) {
                fetchData();
            }
        }, 30000);

        console.log('Dashboard ready! Monitoring:', API_BASE);
    </script>
</body>
</html>
